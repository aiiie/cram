language: python

matrix:
  allow_failures:
    - python: nightly
      env: TESTOPTS=--shell=dash
    - python: pypy3
      env: TESTOPTS=--shell=dash
  include:
    - python: "3.14"
      env: TESTOPTS=--shell=dash
    - python: "3.14"
      env: TESTOPTS=--shell=bash
    - python: "3.14"
      env: TESTOPTS=--shell=zsh
      addons:
        apt:
          packages:
            - zsh
    - python: "3.13"
      env: TESTOPTS=--shell=dash
    - python: "3.12"
      env: TESTOPTS=--shell=dash
    - python: "3.11"
      env: TESTOPTS=--shell=dash
    - python: "3.10"
      env: TESTOPTS=--shell=dash
    - python: "3.9"
      env: TESTOPTS=--shell=dash
    - python: "3.8"
      env: TESTOPTS=--shell=dash
    - python: "3.7"
      env: TESTOPTS=--shell=dash
    - python: "3.6"
      env: TESTOPTS=--shell=dash
    - python: "3.5"
      env: TESTOPTS=--shell=dash
    - python: "3.4"
      env: TESTOPTS=--shell=dash
    - python: "3.3"
      env: TESTOPTS=--shell=dash
    - python: nightly
      env: TESTOPTS=--shell=dash
    - python: pypy3
      env: TESTOPTS=--shell=dash
  fast_finish: true

install: |
  if [ -z "$PYTHON" ]
  then
    pip install -r requirements.txt
  fi

script: |
  if [ -z "$PYTHON" ]
  then
    make test TESTOPTS="$TESTOPTS"
  else
    make quicktest PYTHON="python$PYTHON"
  fi
