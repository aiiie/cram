[build-system]
requires = ["flit_core >=3.11,<5"]
build-backend = "flit_core.buildapi"

[project]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Unix Shell",
    "Topic :: Software Development :: Testing",
]
dynamic = ["version", "description"]
keywords = ["automatic", "functional", "test", "framework"]
license = "GPL-2.0-or-later"
license-files = ["COPYING.txt"]
name = "cram"
readme = "README.rst"
requires-python = ">=3.10"

[project.scripts]
cram = "cram.__main__:main"

[project.urls]
download = "https://bitheap.org/cram/cram-0.8.tar.gz"
homepage = "https://bitheap.org/cram/"

[tool.basedpyright]
reportImplicitOverride = false
reportImplicitStringConcatenation = false
reportUnusedCallResult = false
pythonVersion = "3.10"

[tool.coverage.run]
source = ["cram"]

[tool.flit.sdist]
include = [
    ".coveragerc",
    ".travis.yml",
    "Makefile",
    "pyproject.toml",
    "*.md",
    "*.rst",
    "*.txt",
    "contrib/",
    "examples/",
    "tests/",
]
exclude = ["*.err"]

[tool.mypy]
disallow_any_decorated = true
disallow_any_explicit = true
disallow_any_unimported = true
native_parser = true
python_version = "3.10"
strict = true
strict_equality_for_none = true
warn_unreachable = true

[tool.ruff]
line-length = 80

[tool.ruff.lint]
select = ["A", "ANN", "ARG", "BLE", "C4", "D", "DTZ", "E", "ERA", "F", "FIX",
          "FURB", "ISC", "INP", "G", "PERF", "PIE", "RSE", "RUF", "S", "SIM",
          "SLF", "T20", "TC", "TID", "TRY", "UP", "W"]
ignore = [
    "blank-lines-after-function-or-class",
    "blank-lines-top-level",
    "incorrect-blank-line-before-class",
    "missing-terminal-punctuation",
    "missing-trailing-period",
    "missing-whitespace-around-parameter-equals",
    "multi-line-summary-second-line",
    "too-few-spaces-before-inline-comment",
]
preview = true

[tool.pyrefly]
errors = { missing-override-decorator = "ignore" }
preset = "strict"
python-version = "3.10"

[tool.ty.rules]
division-by-zero = "warn"
missing-override-decorator = "ignore"
missing-type-argument = "warn"
possibly-missing-attribute = "warn"
possibly-missing-import = "warn"
possibly-unresolved-reference = "warn"
unsupported-dynamic-base = "warn"
